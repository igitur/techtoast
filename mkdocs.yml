site_name: TechToast ESP32 Basic Starter Kit
site_description: Documentation for the TechToast ESP32 Basic Starter Kit
site_author: TechToast
repo_url: https://github.com/yourusername/techtoast
repo_name: techtoast

theme:
  name: material
  palette:
    - scheme: default
      primary: teal
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - attr_list
  - md_in_html

plugins:
  - search

nav:
  - Home: index.md
  - Getting Started:
    - Overview: getting-started/index.md
    - Install Arduino IDE: getting-started/setup-arduino-ide.md
    - Add ESP32 Support: getting-started/add-esp32-support.md
    - Connect ESP32: getting-started/connect-esp32.md
    - First Program: getting-started/first-program.md
  - Components Reference:
    - Overview: components/index.md
    - Breadboard Basics: components/breadboard-basics.md
    - All Components: components/index.md
  - Tutorials:
    - Overview: tutorials/index.md
    - IR Obstacle Avoidance Sensor: tutorials/ir-obstacle-avoidance-sensor.md
    - Soil Moisture Sensor: tutorials/soil-moisture-sensor.md
    - Sound Sensor: tutorials/sound-sensor.md
    - Water Level Sensor: tutorials/water-level-sensor.md
    - 7-Segment Display: tutorials/1-digit-7-segment-display.md
    - DHT11 Temperature & Humidity: tutorials/dht11-temperature-humidity-sensor.md
    - Passive Buzzer: tutorials/passive-buzzer.md
    - Active Buzzer: tutorials/active-buzzer.md
    - Push Button: tutorials/push-button.md
    - Thermistor: tutorials/thermistor-temperature-sensor.md
    - Light Sensor (LDR): tutorials/light-sensor-photoresistor.md
    - Tilt Switch: tutorials/tilt-switch.md
    - RGB LED: tutorials/rgb-led.md
    - 5 LEDs Running: tutorials/5-leds-running-left-right.md
  - Web Server Projects:
    - Overview: web-server/index.md
    - Simple Web Server: web-server/simple-web-server.md
    - Control an LED: web-server/web-server-to-control-an-led.md
    - Control 5 LEDs with Slider: web-server/web-server-to-control-5-leds-with-slider.md
  - Appendix:
    - Kit Overview: overview-of-your-esp32-basic-starter-kit.md
    - Setup Guide: setting-up-writing-your-first-program.md
    - Components Details: getting-to-know-your-components.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/yourusername/techtoast
    - icon: fontawesome/brands/twitter
      link: https://twitter.com/techtoast

