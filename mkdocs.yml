site_name: TechToast ESP32 Basic Starter Kit
site_description: Documentation for the TechToast ESP32 Basic Starter Kit
site_author: TechToast
repo_url: https://github.com/yourusername/techtoast
repo_name: techtoast

theme:
  name: material
  palette:
    - scheme: default
      primary: teal
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - attr_list
  - md_in_html

plugins:
  - search
  - awesome-pages

# Navigation is auto-generated by awesome-pages plugin
# based on .pages files in each directory

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/yourusername/techtoast
    - icon: fontawesome/brands/twitter
      link: https://twitter.com/techtoast

